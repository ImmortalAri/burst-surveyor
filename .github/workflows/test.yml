name: Package checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python vendor/verify.py
      - run: python -m pip install -c constraints.txt ./vendor/fitburst-0.1.0-py3-none-any.whl .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m burstsurveyor prepare examples/two-pulse.npz assistant-run --workers 1
      - run: python -m burstsurveyor verify assistant-run/fit
