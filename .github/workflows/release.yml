name: Publish release wheels
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test release wheels
        run: |
          python vendor/verify.py
          python -m pip wheel --no-deps . -w dist
          python -m pip install -c constraints.txt vendor/*.whl dist/*.whl
          python -m pip check
          test "v$(python -c 'from importlib.metadata import version; print(version("burst-surveyor"))')" = "$GITHUB_REF_NAME"
          cd "$RUNNER_TEMP"
          burstsurveyor doctor
          burstsurveyor example two-pulse.npz
          burstsurveyor fit two-pulse.npz run --workers 1
          burstsurveyor verify run
          python -c 'import json; assert json.load(open("run/results.json"))["events"][0]["components"] == 2'
      - name: Publish wheels and tested constraints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "burst surveyor $GITHUB_REF_NAME" \
            --notes 'Installation and the two-pulse example are described in the README. The FitBurst wheel contains the verified CHIME/FRB source and its MIT license.' \
            dist/*.whl vendor/*.whl constraints.txt
