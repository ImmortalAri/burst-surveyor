[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "burst-surveyor"
version = "0.4.0"
authors = [{name = "Ari Polterovich"}]
description = "Automated morphology fitting of radio bursts and folded pulsar profiles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "vendor/NOTICE.md", "vendor/FITBURST-LICENSE.txt"]
requires-python = ">=3.15,<3.16"
classifiers = [
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
]
keywords = ["fast radio bursts", "pulsars", "dynamic spectra", "fitburst", "radio astronomy"]
dependencies = [
  "numpy~=2.5.5",
  "scipy~=1.18.1",
  "psutil~=7.2.2",
  "threadpoolctl~=3.7.0",
  "matplotlib~=3.11.2",
]

[project.optional-dependencies]
fitburst = ["fitburst==0.1.0", "PyYAML~=6.0.4"]

[project.scripts]
burstsurveyor = "burstsurveyor.cli:main"

[project.urls]
Repository = "https://github.com/ImmortalAri/burst-surveyor"
Issues = "https://github.com/ImmortalAri/burst-surveyor/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["burstsurveyor*"]
namespaces = false

[tool.setuptools.package-data]
burstsurveyor = ["science/*.json", "data/*.json"]

[tool.setuptools.data-files]
"share/burst-surveyor/docs" = ["docs/methods.md", "docs/reference.md", "docs/review-queue.md", "docs/selection.md", "docs/guide.md", "docs/validation.md"]
"share/burst-surveyor/docs/ai-assisted-review" = ["docs/ai-assisted-review/README.md"]
