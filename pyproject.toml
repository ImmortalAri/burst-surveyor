[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "burst-surveyor"
version = "0.0.0"
description = "FitBurst reconstruction of dedispersed radio bursts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "vendor/NOTICE.md", "vendor/FITBURST-LICENSE.txt"]
requires-python = ">=3.12,<3.14"
keywords = ["fast radio bursts", "dynamic spectra", "fitburst", "radio astronomy"]
dependencies = [
  "fitburst~=0.1.0",
  "numpy~=2.2.6",
  "scipy~=1.18.1",
  "psutil~=7.2.2",
  "threadpoolctl~=3.7.0",
  "matplotlib~=3.11.2",
]

[project.scripts]
burstsurveyor = "burstsurveyor.cli:main"

[project.urls]
Repository = "https://github.com/ImmortalAri/burst-surveyor"
Issues = "https://github.com/ImmortalAri/burst-surveyor/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["burstsurveyor*"]
namespaces = false

[tool.setuptools.package-data]
burstsurveyor = ["science/*.json", "data/*.json"]

[tool.setuptools.data-files]
"share/burst-surveyor" = ["AGENTS.md"]
"share/burst-surveyor/docs" = ["docs/reference.md"]
